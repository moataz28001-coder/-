<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <a class="navbar-brand" href="{{ url_for('index') }}">العودة للرئيسية</a>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">إضافة مستخدم جديد</div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3"><label>اسم المستخدم</label><input type="text" name="username" class="form-control" required></div>
                            <div class="mb-3"><label>كلمة المرور</label><input type="password" name="password" class="form-control" required></div>
                            <div class="mb-3">
                                <label>الصلاحية</label>
                                <select name="role" class="form-select">
                                    <option value="viewer">سحب وطباعة فقط (Viewer)</option>
                                    <option value="editor">إدخال وتعديل (Editor)</option>
                                    <option value="admin">مدير النظام (Admin)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">إضافة</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">المستخدمون الحاليون</div>
                    <div class="card-body">
                        <table class="table">
                            <thead><tr><th>#</th><th>الاسم</th><th>الصلاحية</th></tr></thead>
                            <tbody>
                                {% for user in users %}
                                <tr><td>{{ loop.index }}</td><td>{{ user.username }}</td><td>{{ user.role }}</td></tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
